<!doctype html>
<html lang="en">
<head>
    <!-- กำหนด Viewport เพื่อให้รองรับการแสดงผลบนมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Inwzashop Farm Dashboard</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN สำหรับการจัดสไตล์ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* กำหนดรูปแบบหลักของหน้าเว็บ */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb; /* สีพื้นหลังอ่อน ๆ */
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        /* กำหนดขนาดของ Root element ให้เต็มหน้าจอ */
        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- 
        นี่คือจุดที่สำคัญที่สุด:
        React จะใช้ JavaScript เพื่อค้นหา element นี้ (id="root")
        และแทรก Dashboard Component (App) เข้าไป
    -->
    <div id="root"></div>

    <!-- 
        นี่คือจุดเริ่มต้นการทำงานของ React Application (Vite Entry Point)
        มันจะรันไฟล์ main.jsx ที่เราเพิ่งแก้ไข
    -->
    <script type="module" src="/main.jsx"></script>
</body>
</html>
